<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; worker-src 'self'; img-src data: blob:">
<title>SN_INIT</title>
<style>
html, body { margin: 0; height: 100%; background: #ffffff; }
textarea { box-sizing: border-box; width: 100%; height: 100%; border: 0; padding: 12px 16px; resize: none; outline: none;
  background: #ffffff; color: #111111; font: 18px/1.4 Arial, sans-serif; }
::selection, textarea::selection { background: #3390ff; color: #ffffff; }
textarea::-webkit-scrollbar { width: 14px; }
textarea::-webkit-scrollbar-track { background: #eeeeee; }
textarea::-webkit-scrollbar-thumb { background: #9a9a9a; border-radius: 7px; border: 3px solid #eeeeee; }
html.view, html.view body { background: transparent; overflow: hidden; }
html.view img { display: block; width: 100%; height: 100%; object-fit: contain; }
html.view .miss { color: #9a9a9a; font: 14px Arial, sans-serif; text-align: center; padding-top: 12px; }
html.paste, html.paste body { background: #1b1d22; overflow: hidden; cursor: default; }
html.paste .box { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 2px dashed #4a5060; border-radius: 6px; color: #e2e2e2; font: 18px Arial, sans-serif; text-align: center; padding: 8px; }
html.paste .box small { color: #9a9a9a; font-size: 13px; margin-top: 6px; }
html.paste .box.busy { border-color: #7a8cff; }
html.paste.light, html.paste.light body { background: #efe4cf; }
html.paste.light .box { border-color: #4a3f2e; color: #2b241a; }
html.paste.light .box small { color: #6b5d45; }
html.paste.light .box.busy { border-color: #335eff; }
</style>
</head>
<body>
<script>
(function () {
    'use strict';
    if (window.top !== window.self) return;
    var PREFIX = 'shop_notes.';
    var KEY = /^[a-z0-9_]{1,40}$/;
    var CHUNK = 1500, MAX = 1000000, VERSION = 6, BIG_CHUNK = 3000, TITLE_MAX = 4000;
    var SNAP_KEY = /^(a[0-9a-z]{1,7}_)?snap_[0-9]{8}_[0-9]+_[0-9]+$/, ACCT = /^a[0-9a-z]{1,7}_/;
    var NS = /^(a[0-9a-z]{1,7}_)?$/, IMG_ID = /^[0-9a-z]{4,16}$/;
    var IMG_KEY = /^(a[0-9a-z]{1,7}_)?img_([0-9a-z]{4,16})(_meta)?$/;
    var IMG_W = 1280, IMG_BIG = 700000, RESERVE = 200000, GRACE_MS = 600000;
    try {
        if ('serviceWorker' in navigator && location.protocol === 'https:')
            navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
    } catch (e) {}
    function get(k) { try { return localStorage.getItem(PREFIX + k) || ''; } catch (e) { return ''; } }
    function reply(n, obj) { document.title = 'SN:' + n + ':' + JSON.stringify(obj); }
    function hashOf(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36) + '.' + s.length.toString(36); }
    function utf8Len(s) { var n = 0; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); n += c < 0x80 ? 1 : c < 0x800 ? 2 : (c >= 0xD800 && c <= 0xDBFF) ? 4 : (c >= 0xDC00 && c <= 0xDFFF) ? 0 : 3; } return n; }
    function hasWords(t) { return String(t || '').replace(/^\u0001SN2\n/, '').replace(/\[\[/g, 'x').replace(/\[\$[^\]]*\]/g, 'x').replace(/\[[%~@\/][^\]]*\]/g, '').trim().length > 0; }
    function prefixOf(k) { var m = ACCT.exec(k); return m ? m[0] : ''; }
    function param(name) { var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
    if (/[?&]ui=1/.test(location.search)) {
        var key = location.hash.slice(1);
        if (!KEY.test(key)) key = 'general';
        var ta = document.createElement('textarea');
        ta.spellcheck = false;
        ta.value = get(key);
        document.body.appendChild(ta);
        function save() { try { localStorage.setItem(PREFIX + key, ta.value.slice(0, MAX)); } catch (e) {} }
        ta.addEventListener('input', save);
        ta.addEventListener('blur', save);
        var seq = 0;
        function report(st) { document.title = 'SN_UI:' + key + ':' + st + ':' + (++seq); }
        window.addEventListener('focus', function () { ta.focus(); report('f1'); });
        window.addEventListener('blur', function () { report('f0'); });
        document.addEventListener('mousedown', function () { if (!document.hasFocus()) report('want'); }, true);
        ta.focus();
        report(document.hasFocus() ? 'f1' : 'f0');
        return;
    }
    var viewKey = param('view');
    if (viewKey !== null) {
        document.documentElement.className = 'view';
        var vm = IMG_KEY.exec(viewKey), data = '';
        if (vm && !vm[3]) {
            data = get(viewKey);
            if (!data && vm[1]) data = get('img_' + vm[2]);
        }
        if (/^data:image\/(jpeg|webp|png);base64,/.test(data)) {
            var im = document.createElement('img');
            im.alt = '';
            im.src = data;
            document.body.appendChild(im);
            document.title = 'SNV:ok';
        } else {
            var ms = document.createElement('div');
            ms.className = 'miss';
            ms.textContent = 'Screenshot not found on this PC';
            document.body.appendChild(ms);
            document.title = 'SNV:missing';
        }
        return;
    }
    if (/[?&]paste=1/.test(location.search)) {
        function pasteTheme() { var m = /(?:^#|&)theme=(light|dark)/.exec(location.hash); var t = m ? m[1] : param('theme'); document.documentElement.className = t === 'light' ? 'paste light' : 'paste'; }
        pasteTheme();
        window.addEventListener('hashchange', pasteTheme);
        var ns = param('ns') || '', id = param('id') || '', pseq = 0, done = false, busy = false;
        function say(o) { document.title = 'SNP:' + (++pseq) + ':' + JSON.stringify(o); }
        var box = document.createElement('div');
        box.className = 'box';
        box.appendChild(document.createTextNode('Press Ctrl+V to paste a screenshot'));
        var hint = document.createElement('small');
        hint.textContent = 'Click here first if nothing happens. Esc cancels.';
        box.appendChild(hint);
        document.body.appendChild(box);
        if (!NS.test(ns) || !IMG_ID.test(id)) { say({ st: 'error', err: 'bad paste request' }); return; }
        function finish(o) { if (done) return; done = true; say(o); }
        function sendText(t) {
            t = String(t || '');
            var parts = Math.max(1, Math.ceil(t.length / CHUNK));
            if (parts > 40) { t = t.slice(0, 40 * CHUNK); parts = 40; }
            done = true;
            for (var p = 0; p < parts; p++) say({ st: 'notimage', part: p, parts: parts, s: t.slice(p * CHUNK, (p + 1) * CHUNK) });
        }
        function encode(img) {
            var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
            if (!w || !h) return null;
            var tw = Math.min(IMG_W, w), th = Math.max(1, Math.round(h * tw / w));
            var c = document.createElement('canvas');
            c.width = tw; c.height = th;
            var g = c.getContext('2d');
            g.fillStyle = '#000000'; g.fillRect(0, 0, tw, th);
            g.drawImage(img, 0, 0, tw, th);
            function best(q) {
                var a = c.toDataURL('image/jpeg', q), b = '';
                try { b = c.toDataURL('image/webp', q); } catch (e) {}
                return b.indexOf('data:image/webp') === 0 && b.length < a.length ? b : a;
            }
            var out = best(0.8);
            if (out.length > IMG_BIG) out = best(0.6);
            return { data: out, w: tw, h: th };
        }
        function store(enc) {
            var k = PREFIX + ns + 'img_' + id, mk = k + '_meta';
            try {
                localStorage.setItem(k, enc.data);
                localStorage.setItem(mk, JSON.stringify({ w: enc.w, h: enc.h, bytes: enc.data.length }));
            } catch (e) {
                try { localStorage.removeItem(k); localStorage.removeItem(mk); } catch (e2) {}
                return 'full';
            }
            try { localStorage.setItem(PREFIX + 'imgprobe_tmp', new Array(RESERVE + 1).join('x')); localStorage.removeItem(PREFIX + 'imgprobe_tmp'); }
            catch (e) {
                try { localStorage.removeItem(PREFIX + 'imgprobe_tmp'); localStorage.removeItem(k); localStorage.removeItem(mk); } catch (e2) {}
                return 'full';
            }
            return '';
        }
        function useBlob(blob) {
            if (done || busy) return;
            busy = true; box.className = 'box busy';
            var url = URL.createObjectURL(blob), img = new Image();
            img.onload = function () {
                busy = false;
                var enc = null;
                try { enc = encode(img); } catch (e) { URL.revokeObjectURL(url); finish({ st: 'error', err: String(e && e.message || e) }); return; }
                URL.revokeObjectURL(url);
                if (!enc) { finish({ st: 'error', err: 'empty picture' }); return; }
                var r = store(enc);
                if (r) { finish({ st: 'full' }); return; }
                finish({ st: 'ok', id: id, w: enc.w, h: enc.h, bytes: enc.data.length, type: enc.data.slice(5, enc.data.indexOf(';')) });
            };
            img.onerror = function () { busy = false; URL.revokeObjectURL(url); finish({ st: 'error', err: 'picture could not be read' }); };
            img.src = url;
        }
        function tryRead(why) {
            if (done || busy) return;
            if (!navigator.clipboard || !navigator.clipboard.read) { say({ st: 'denied', err: 'no clipboard.read', why: why }); return; }
            navigator.clipboard.read().then(function (items) {
                if (done) return;
                for (var i = 0; i < items.length; i++) {
                    var types = items[i].types || [];
                    for (var j = 0; j < types.length; j++) if (/^image\//.test(types[j])) {
                        items[i].getType(types[j]).then(useBlob, function (e) { say({ st: 'denied', err: String(e && e.name || e), why: why }); });
                        return;
                    }
                }
                for (var a = 0; a < items.length; a++) if ((items[a].types || []).indexOf('text/plain') >= 0) {
                    items[a].getType('text/plain').then(function (b) { return b.text(); }).then(sendText, function () { sendText(''); });
                    return;
                }
                sendText('');
            }, function (e) { say({ st: 'denied', err: String(e && e.name || e) + ': ' + String(e && e.message || ''), why: why }); });
        }
        document.addEventListener('paste', function (e) {
            if (done) return;
            var cd = e.clipboardData, items = cd && cd.items ? cd.items : [];
            e.preventDefault();
            for (var i = 0; i < items.length; i++) if (items[i].kind === 'file' && /^image\//.test(items[i].type)) { var f = items[i].getAsFile(); if (f) { useBlob(f); return; } }
            sendText(cd ? cd.getData('text/plain') : '');
        });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' || e.keyCode === 27) { done = true; say({ st: 'esc' }); } });
        window.addEventListener('focus', function () { tryRead('focus'); });
        document.addEventListener('mousedown', function () { tryRead('click'); });
        say({ st: 'wait', focus: document.hasFocus() ? 1 : 0 });
        tryRead('load');
        return;
    }
    function referenced() {
        var refs = {}, snaps = {}, k, i, re = /\[\$img:([0-9a-z]+)/g, mm;
        function scan(s) { re.lastIndex = 0; while ((mm = re.exec(s))) refs[mm[1]] = 1; }
        for (i = 0; i < localStorage.length; i++) {
            k = localStorage.key(i);
            if (!k || k.indexOf(PREFIX) !== 0) continue;
            k = k.slice(PREFIX.length);
            if (IMG_KEY.test(k)) continue;
            var sm = /^((?:a[0-9a-z]{1,7}_)?snap_[0-9]{8}_[0-9]+)_([0-9]+)$/.exec(k);
            if (sm) (snaps[sm[1]] = snaps[sm[1]] || [])[+sm[2]] = get(k);
            else scan(get(k));
        }
        for (k in snaps) scan(snaps[k].join(''));
        return refs;
    }
    function gc(m) {
        var ns = String(m.gc), keep = {}, now = Date.now(), refs = referenced(), drop = [], i, k, im, total = 0, kept = 0;
        (m.keep || []).forEach(function (x) { keep[String(x)] = 1; });
        var keys = [];
        for (i = 0; i < localStorage.length; i++) { k = localStorage.key(i); if (k && k.indexOf(PREFIX) === 0) keys.push(k.slice(PREFIX.length)); }
        keys.forEach(function (key) {
            im = IMG_KEY.exec(key);
            if (!im) return;
            if (!im[3]) total += get(key).length;
            if ((im[1] || '') !== ns) return;
            var id = im[2], born = parseInt(id.slice(0, 8), 36);
            var young = !(born > 1e12) || now - born < GRACE_MS;
            if (refs[id] || keep[id] || young) { if (!im[3]) kept++; return; }
            localStorage.removeItem(PREFIX + key);
            if (!im[3]) drop.push(id);
        });
        return { gc: ns, removed: drop, kept: kept, bytes: total };
    }
    var pending = {};
    function handle() {
        var h = location.hash.slice(1);
        if (!h) { reply(0, { ready: 1, v: VERSION, caps: ['del', 'max', 'sw', 'img', 'chunk', 'copy', 'theme', 'themehash'], max: MAX, chunk: BIG_CHUNK }); return; }
        var m;
        try { m = JSON.parse(decodeURIComponent(h)); } catch (e) { return; }
        if (!m || typeof m !== 'object') return;
        var n = String(Math.floor(Number(m.n) || 0));
        try {
            if (typeof m.set === 'string' && KEY.test(m.set) && typeof m.text === 'string') {
                var parts = Math.max(1, Math.min(100, Math.floor(Number(m.parts) || 1))), part = Math.floor(Number(m.part) || 0);
                if (parts === 1) localStorage.setItem(PREFIX + m.set, m.text.slice(0, MAX));
                else {
                    if (part === 0) pending[m.set] = [];
                    (pending[m.set] = pending[m.set] || [])[part] = m.text;
                    if (part === parts - 1) { localStorage.setItem(PREFIX + m.set, pending[m.set].join('').slice(0, MAX)); delete pending[m.set]; }
                }
                reply(n, { key: m.set, part: part, len: get(m.set).length });
            } else if (typeof m.copy === 'string' && typeof m.to === 'string') {
                var src = m.copy, dst = m.to;
                if (!KEY.test(src) || !KEY.test(dst) || IMG_KEY.test(src) || SNAP_KEY.test(src) || /_prev$/.test(src)) reply(n, { error: 'bad copy' });
                else if (dst !== src + '_prev' && !(SNAP_KEY.test(dst) && prefixOf(dst) === prefixOf(src))) reply(n, { error: 'bad copy target' });
                else {
                    var tx = get(src);
                    localStorage.setItem(PREFIX + dst, tx);
                    reply(n, { key: src, to: dst, len: get(dst).length, h: hashOf(tx), w: hasWords(tx) ? 1 : 0 });
                }
            } else if (typeof m.del === 'string') {
                if (!SNAP_KEY.test(m.del)) reply(n, { error: 'not removable' });
                else { localStorage.removeItem(PREFIX + m.del); reply(n, { key: m.del, del: 1, len: 0 }); }
            } else if (typeof m.gc === 'string') {
                if (!NS.test(m.gc)) reply(n, { error: 'bad prefix' });
                else reply(n, gc(m));
            } else if (typeof m.get === 'string' && KEY.test(m.get)) {
                var s = get(m.get), off = Math.max(0, Math.floor(Number(m.off) || 0));
                if (m.lim === undefined) { reply(n, { key: m.get, len: s.length, off: off, s: s.slice(off, off + CHUNK) }); return; }
                var lim = Math.max(1, Math.min(BIG_CHUNK, Math.floor(Number(m.lim) || CHUNK))), out;
                for (;;) {
                    out = 'SN:' + n + ':' + JSON.stringify({ key: m.get, len: s.length, off: off, s: s.slice(off, off + lim) });
                    if ((out.length <= TITLE_MAX && utf8Len(out) <= TITLE_MAX) || lim <= 64) break;
                    lim = Math.max(64, Math.floor(lim * 0.75));
                }
                document.title = out;
            }
        } catch (e) { reply(n, { error: String(e && e.message || e) }); }
    }
    window.addEventListener('hashchange', handle);
    handle();
})();
</script>
</body>
</html>
