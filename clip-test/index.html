<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>CT:start</title>
<style>html,body{margin:0;height:100%;background:#2a6;color:#fff;font:15px sans-serif}#drop{position:absolute;inset:0;border:4px dashed #fff}#o{position:relative;z-index:2}#img{max-width:100%;max-height:300px;display:block;position:relative;z-index:2}</style></head>
<body><div id="drop"></div><div id="o">capture/drop test</div><img id="img"><video id="v" autoplay muted style="display:none"></video>
<script>
var o=document.getElementById('o'),n=0;
function R(s){n++;document.title='CT:'+n+':'+s;o.textContent+=' | '+s;}
function show(blob,how){var im=document.getElementById('img');im.onload=function(){R(how+' image '+im.naturalWidth+'x'+im.naturalHeight);};im.src=URL.createObjectURL(blob);}
var md=navigator.mediaDevices;
R('mediaDevices='+(!!md)+' getDisplayMedia='+(!!(md&&md.getDisplayMedia))+' getUserMedia='+(!!(md&&md.getUserMedia)));
function cap(){
 if(!(md&&md.getDisplayMedia)){R('no getDisplayMedia');return;}
 md.getDisplayMedia({video:true,audio:false}).then(function(st){
   R('display stream ok tracks='+st.getVideoTracks().length+' label='+(st.getVideoTracks()[0]&&st.getVideoTracks()[0].label));
   var v=document.getElementById('v');v.srcObject=st;v.onloadedmetadata=function(){setTimeout(function(){var c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(function(b){show(b,'capture');st.getTracks().forEach(function(t){t.stop();});},'image/jpeg',0.8);},500);};
 },function(e){R('display denied '+e.name+' '+e.message);});
}
document.addEventListener('dragover',function(e){e.preventDefault();});
document.addEventListener('dragenter',function(e){R('dragenter');});
document.addEventListener('drop',function(e){e.preventDefault();var f=e.dataTransfer&&e.dataTransfer.files;R('drop files='+(f?f.length:0));if(f&&f[0])show(f[0],'drop');});
window.addEventListener('hashchange',function(){if(location.hash.indexOf('cap')===1)cap();});
document.addEventListener('click',function(){cap();});
setTimeout(cap,1500);
</script></body></html>
